# SPDX-License-Identifier: Apache-2.0

version: '2'

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - perfsprint
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    goconst:
      min-occurrences: 5
    gocritic:
      enabled-checks:
        - boolExprSimplify
        - emptyStringTest
        - httpNoBody
        - preferFilepathJoin
        - redundantSprint
        - stringConcatSimplify
        - timeExprSimplify
        - typeUnparen
    gosec:
      excludes:
        - G112
        - G306
    nolintlint:
      require-specific: true
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-layout: true
      crypto-hash: true
    whitespace:
      multi-func: true

  exclusions:
    generated: lax


issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kengou/Jira-ticket-creator
