version: '2'

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - goconst
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nolintlint
    - perfsprint
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
    - whitespace

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    goconst:
      min-occurrences: 5
      # golangci-lint v2.12 counts string occurrences in _test.go files;
      # test fixtures legitimately repeat literals, so exclude them.
      ignore-tests: true
    gocritic:
      enabled-checks:
        - boolExprSimplify
        - emptyStringTest
        - httpNoBody
        - preferFilepathJoin
        - redundantSprint
        - stringConcatSimplify
        - timeExprSimplify
        - typeUnparen
    gosec:
      excludes:
        - G112
        - G306
        # G703/G704 are taint-analysis variants of G304/G107. The underlying
        # concerns are mitigated: executable paths are resolved via filepath.Abs,
        # and HTTP URLs are validated (scheme check) and re-serialised via
        # url.URL.String() before use. Gosec's taint engine cannot reason about
        # these sanitisers and produces false positives in both cases.
        - G703
        - G704
    nolintlint:
      require-specific: true
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-layout: true
      crypto-hash: true
    whitespace:
      multi-func: true

  exclusions:
    generated: lax
    paths:
      # Vendored JS dependencies ship stray Go files (e.g. flatted); not our code.
      - ^vscode-extension/


issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kengou/jira-ticket-creator
  exclusions:
    paths:
      - ^vscode-extension/
