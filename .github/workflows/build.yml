name: Build

on:
  push:
    tags: [ 'v*' ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true
      
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o jira-ai-creator-${{ matrix.goos }}-${{ matrix.goarch }} .
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: jira-ai-creator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: jira-ai-creator-${{ matrix.goos }}-${{ matrix.goarch }}
